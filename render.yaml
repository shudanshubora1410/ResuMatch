services:
  - type: web
    name: resumatch
    runtime: docker
    plan: free
    region: singapore
    autoDeploy: true

    # Render has no native Java runtime. Their supported languages are
    # Node.js/Bun, Python, Ruby, Go, Rust and Elixir - a Java/Spring Boot
    # app has to be deployed as a Docker image. The Dockerfile in this repo
    # builds the fat JAR with Maven and ships it on a slim JRE.
    #
    # The build takes a few minutes the first time because Maven downloads
    # ~150MB of dependencies inside the container. The dependency layer is
    # cached separately from the source, so later builds are much faster.

    # /api/health is a pure-liveness endpoint: no database, no JPA, no
    # repository beans. It answers in a few milliseconds, so Render never
    # kills the instance for a slow first request.
    # (The old path /api/public/needs-seed queried JPA repositories, and
    # under lazy initialization the first call rebuilt the entire
    # EntityManagerFactory inside the healthcheck request -> 502.)
    healthCheckPath: /api/health

    envVars:
      # MySQL (Aiven). The DB_* values are set in the Render dashboard -
      # never commit database credentials to a repo.
      - key: SPRING_PROFILES_ACTIVE
        value: mysql

      # Aiven requires TLS. The container entrypoint builds a JVM truststore
      # from the bundled CA certificate and injects a TLS-trusting DB_URL
      # automatically, so no DB_URL needs to be set here.
      #
      # If Aiven rotates the CA, mount the new certificate through Render
      # Secret Files and point this at it:
      # - key: AIVEN_CA_FILE
      #   value: /etc/secrets/aiven-project-ca.pem

      # Seed the demo dataset on boot only when the database is empty.
      # Safe to leave on: it never overwrites existing data.
      - key: RESUMATCH_AUTO_SEED
        value: "true"

      # Render injects PORT automatically; the entrypoint reads it.
      - key: JAVA_TOOL_OPTIONS
        value: -XX:+UseG1GC -XX:MaxRAMPercentage=70 -XX:+UseSerialGC -XX:TieredStopAtLevel=1
