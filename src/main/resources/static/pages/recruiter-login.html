<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Recruiter login · ResuMatch</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="/css/app.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <nav class="nav">
    <div class="nav-inner">
      <a href="/" class="brand"><div class="brand-mark">R</div> ResuMatch</a>
      <div class="nav-links">
        <a href="/pages/recruiter-register.html" class="btn small">Create account</a>
        <a href="/pages/seeker-login.html" class="btn small">Seeker login</a>
      </div>
    </div>
  </nav>

  <div class="container" style="max-width: 480px; padding-top: 60px;">
    <div class="card">
      <h2>Recruiter login</h2>
      <p class="muted">Log in to manage your jobs and rank applicants.</p>
      <form id="loginForm">
        <div class="form-row">
          <label>Email or name</label>
          <input class="input" name="identifier" required />
        </div>
        <div class="form-row">
          <label>Password</label>
          <input class="input" name="password" type="password" required />
        </div>
        <button class="btn primary" style="width:100%">Log in</button>
      </form>
      <p class="muted" style="margin-top: 14px; font-size: 0.9rem;">
        New here? <a href="/pages/recruiter-register.html">Create a recruiter account</a>
      </p>
    </div>
  </div>

  <script src="/js/app.js"></script>
  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const fd = new FormData(e.target);
      try {
        const r = await api.post('/api/auth/login', Object.fromEntries(fd));
        toast('Logged in', 'ok');
        setTimeout(() => window.location.href = r.data.redirect || '/pages/recruiter-dashboard.html', 300);
      } catch (_) {}
    });
  </script>
</body>
</html>
