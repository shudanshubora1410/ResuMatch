<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Edit job · ResuMatch</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="/css/app.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <nav class="nav">
    <div class="nav-inner">
      <a href="/pages/recruiter-dashboard.html" class="brand"><div class="brand-mark">R</div> ResuMatch</a>
      <div class="nav-links">
        <a href="/pages/recruiter-dashboard.html">Dashboard</a>
        <a href="/pages/recruiter-job-new.html">New job</a>
        <!--BELL--><a href="#" id="notifBell" class="bell" title="Notifications" style="display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,0.04);border:1px solid var(--line);color:var(--text);margin-right:8px;">🔔</a><a href="#" id="logoutBtn" class="btn small">Log out</a>
      </div>
    </div>
  </nav>

  <div class="container">
    <h1>Edit job</h1>
    <div class="card">
      <form id="jobForm">
        <div class="grid grid-2">
          <div>
            <div class="form-row"><label>Title</label><input class="input" name="title" required /></div>
            <div class="form-row"><label>Location</label><input class="input" name="location" /></div>
            <div class="form-row"><label>Employment type</label>
              <select class="select" name="employmentType">
                <option>Full-time</option><option>Internship</option><option>Part-time</option><option>Contract</option>
              </select>
            </div>
          </div>
          <div>
            <div class="form-row"><label>Description</label><textarea class="input" name="description" rows="6"></textarea></div>
          </div>
        </div>
        <h3 style="margin-top:14px">Skills &amp; weights</h3>
        <div class="table-wrap">
          <table class="table" id="skillsTable">
            <thead><tr><th>Skill</th><th>Importance</th><th>Weight</th><th></th></tr></thead>
            <tbody></tbody>
          </table>
        </div>
        <button type="button" class="btn small" id="addSkill">+ Add skill</button>
        <div style="margin-top: 20px; display:flex; gap: 10px;">
          <button class="btn primary" type="submit">Save changes</button>
          <a class="btn ghost" href="/pages/recruiter-dashboard.html">Cancel</a>
        </div>
      </form>
    </div>
  </div>

  <script src="/js/app.js"></script>
  <script>
    const jobId = new URLSearchParams(location.search).get('id');
    document.getElementById('logoutBtn').addEventListener('click', async (e) => { e.preventDefault(); await api.post('/api/auth/logout', {}); window.location.href = '/'; });
    function addRow(skill = '', importance = 'MUST_HAVE', weight = 5) {
      const tbody = document.querySelector('#skillsTable tbody');
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td><input class="input" name="skill" value="${escapeHtml(skill)}" /></td>
        <td><select class="select" name="importance">
          <option value="MUST_HAVE" ${importance === 'MUST_HAVE' ? 'selected' : ''}>Must have</option>
          <option value="NICE_TO_HAVE" ${importance === 'NICE_TO_HAVE' ? 'selected' : ''}>Nice to have</option>
        </select></td>
        <td><input class="input" name="weight" type="number" step="0.5" min="0.5" value="${weight}" style="max-width:100px" /></td>
        <td><button type="button" class="btn small" data-act="remove">Remove</button></td>`;
      tr.querySelector('[data-act=remove]').addEventListener('click', () => tr.remove());
      tbody.appendChild(tr);
    }
    document.getElementById('addSkill').addEventListener('click', () => addRow());
    async function load() {
      const me = await requireAuth('RECRUITER'); if (!me) return;
      const j = (await api.get('/api/recruiter/jobs/' + jobId)).data;
      const f = document.getElementById('jobForm');
      f.title.value = j.title; f.location.value = j.location || ''; f.employmentType.value = j.employmentType || 'Full-time';
      f.description.value = j.description || '';
      (j.skills || []).forEach(s => addRow(s.name, s.importance, s.weight));
    }
    document.getElementById('jobForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const fd = new FormData(e.target);
      const skills = [...document.querySelectorAll('#skillsTable tbody tr')].map(tr => ({
        name: tr.querySelector('[name=skill]').value.trim(),
        importance: tr.querySelector('[name=importance]').value,
        weight: Number(tr.querySelector('[name=weight]').value)
      })).filter(s => s.name);
      const body = {
        title: fd.get('title'), location: fd.get('location'),
        employmentType: fd.get('employmentType'), description: fd.get('description'), skills
      };
      await api.put('/api/recruiter/jobs/' + jobId, body);
      toast('Job updated', 'ok');
      setTimeout(() => window.location.href = '/pages/recruiter-dashboard.html', 500);
    });
    load();
  </script>
</body>
</html>
