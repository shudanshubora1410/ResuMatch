# ---- MySQL profile (activate by setting SPRING_PROFILES_ACTIVE=mysql) ----
#
# The JDBC URL is fully overridable via the DB_URL env var. Use that when the
# host needs non-default connection parameters - for example Aiven, which
# requires TLS by default:
#
#   DB_URL=jdbc:mysql://host:port/resumatch?useSSL=true&requireSSL=true&serverTimezone=UTC&allowPublicKeyRetrieval=true
#
# When DB_URL is not set, the URL below is built from the individual DB_*
# variables, which is what you want for a local MySQL on localhost.
spring.datasource.url=${DB_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:resumatch}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASS:root}

# Never let HikariCP hand out a connection that the server has already closed.
# Aiven's free tier closes idle connections aggressively; this makes the pool
# validate them before use instead of failing the request.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.keepalive-time=30000
spring.datasource.hikari.max-lifetime=600000

# Hibernate creates/updates the schema on boot. It will create TABLES but not
# the DATABASE itself - the `resumatch` schema must already exist.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Do not hold the connection open across a view render. It keeps the Hikari
# pool free for real work and avoids "too many connections" on small Aiven
# instances.
spring.jpa.open-in-view=false
