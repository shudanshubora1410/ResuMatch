# ---- MySQL profile (activate by setting SPRING_PROFILES_ACTIVE=mysql) ----
#
# The JDBC URL is fully overridable via the DB_URL env var. Use that when the
# host needs non-default connection parameters - for example Aiven, which
# requires TLS by default:
#
#   DB_URL=jdbc:mysql://host:port/resumatch?useSSL=true&requireSSL=true&serverTimezone=UTC&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true
#
# rewriteBatchedStatements=true is important: without it the MySQL driver sends
# every row of a JDBC batch as its own round-trip instead of rewriting them into
# a single multi-row INSERT. On a remote MySQL (~180ms per round-trip) that
# turned a 110-row seed into 110 separate requests, which exceeded the managed
# host's connection timeout and dropped the socket mid-seed.
#
# When DB_URL is not set, the URL below is built from the individual DB_*
# variables, which is what you want for a local MySQL on localhost.
spring.datasource.url=${DB_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:resumatch}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASS:root}

# Pool tuning for managed MySQL (Aiven / PlanetScale / RDS).
#
# Aiven's free tier aggressively closes idle connections, so the pool needs to
# validate before use and keep connections warm. NOTE: HikariCP requires
# keepaliveTime < maxLifetime - if keepalive is larger, Hikari silently
# disables it and logs "idleTimeout is close to or more than maxLifetime".
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.keepalive-time=60000
spring.datasource.hikari.max-lifetime=300000
spring.datasource.hikari.idle-timeout=0

# The auto-seeder writes a lot of rows in one transaction. On a remote MySQL
# over TLS that can take 20-30s, and Aiven's server-side timeout can kill the
# connection mid-transaction. Running the seeder in its own transaction with a
# generous timeout avoids "SQLSTATE(08S01)" during boot.
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true

# Schema management.
#
# The schema is created ONCE by schema-mysql.sql (run it by hand against the
# target database). The app then VALIDATES the schema on boot instead of
# generating DDL.
#
# Why not `update`? With `update`, Hibernate issues ~31 CREATE/ALTER
# statements and ~20 metadata SELECTs on every boot. On a remote MySQL
# (Aiven, ~200ms per round-trip) that is 10+ seconds of DDL traffic over a
# single connection, and Aiven's free tier drops that connection partway
# through - the app dies with a half-created schema and a
# "Communications link failure" error.
#
# `validate` only checks that the tables and columns match the entities.
# It is fast, it is read-only, and it fails loudly if the schema is wrong
# instead of silently mangling it.
#
# For local H2 development the default profile still uses `update`, so the
# zero-setup experience is unchanged.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Do not hold the connection open across a view render. It keeps the Hikari
# pool free for real work and avoids "too many connections" on small Aiven
# instances.
spring.jpa.open-in-view=false
