spring.application.name=ResuMatch

# ---- Profile-aware datasource ----
# Default: H2 (works out of the box, no setup required)
# To use MySQL: set SPRING_PROFILES_ACTIVE=mysql + DB_HOST + DB_NAME + DB_USER + DB_PASS
#   See run.bat (Windows) or run.sh (Mac/Linux) for the easy way.
# Tip: copy .env.example to .env and edit your MySQL credentials there.
spring.profiles.active=${SPRING_PROFILES_ACTIVE:h2}

# H2 file-backed (for development/demo)
spring.datasource.url=jdbc:h2:file:./data/resumatch;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# File storage (absolute path so it works regardless of Tomcat's CWD)
resumatch.storage.path=${RESUMATCH_STORAGE:${user.dir}/storage}
resumatch.storage.max-bytes=10485760

# Mail (placeholder; emails are logged to console if not configured)
spring.mail.host=localhost
spring.mail.port=2525
spring.mail.username=
spring.mail.password=

# Server
server.port=${PORT:8080}
server.address=0.0.0.0
server.servlet.session.timeout=30m

# Gemini API (set GEMINI_API_KEY env var; the AI description feature degrades gracefully if absent)
resumatch.gemini.api-key=${GEMINI_API_KEY:}

# Multipart limits
spring.servlet.multipart.max-file-size=12MB
spring.servlet.multipart.max-request-size=12MB
spring.servlet.multipart.file-size-threshold=1MB

# Logging
logging.level.com.resumatch=INFO
logging.level.org.springframework.security=WARN

# Cloud deploy (Render/Railway/Koyeb):
#   The app must be able to answer a healthcheck FAST. The healthcheck
#   endpoint /api/health touches no database, so the server is listening
#   and healthy within ~1 second of the JVM starting, even though the
#   Hibernate/JPA layer initializes a moment later.
#
#   NOTE: spring.main.lazy-initialization is intentionally NOT enabled.
#   With it on, the first request to any repository-backed endpoint forced
#   the entire Hibernate bootstrap to happen inside that request, which is
#   what caused the 502 Bad Gateway on Render (the healthcheck request
#   timed out while it was building the EntityManagerFactory).
# Auto-seed the demo dataset on boot when true.
# Useful on cloud platforms with an ephemeral filesystem (Render free tier,
# Railway, Koyeb) where the H2 database is wiped on every redeploy - without
# it, the public URL would show an empty app. Off by default.
resumatch.auto-seed=${RESUMATCH_AUTO_SEED:false}

# Healthcheck / readiness tuning
management.endpoints.enabled-by-default=true
management.endpoint.health.show-details=always

# Tomcat: start accepting connections as soon as the context is ready
server.tomcat.threads.max=50
server.tomcat.max-connections=200
server.tomcat.connection-timeout=20000
server.tomcat.keep-alive-timeout=60000
